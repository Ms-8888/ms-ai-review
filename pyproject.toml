[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-ai-review"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.34.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[project.scripts]
ms-ai-review = "ms_ai_review.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
packages = ["ms_ai_review"]

[tool.ruff.lint.per-file-ignores]
"ms_ai_review/prompts.py" = ["E501"]
"tests/*" = ["E501"]
